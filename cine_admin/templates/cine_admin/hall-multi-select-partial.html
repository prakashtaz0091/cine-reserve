<div
    id="hallContainer"
    class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">

    {% for hall in halls %}

        <label
            class="hall-item group flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 bg-white p-4 transition hover:border-indigo-300 hover:bg-indigo-50">

            <input
                type="checkbox"
                name="halls"
                value="{{ hall.id }}"
                data-cinema="{{ hall.cinema_id }}"
                class="hall-checkbox h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">

            <div class="min-w-0 flex-1">
                <div class="text-sm font-semibold text-slate-900">
                    {{ hall.name }}
                </div>

                <div class="mt-1 text-xs text-slate-500">
                    {{ hall.row }} rows × {{ hall.col }} columns
                </div>
            </div>

        </label>

    {% empty %}

        <div class="col-span-full rounded-xl border border-dashed border-slate-300 p-6 text-center">
            <p class="text-sm text-slate-500">
                No cinema halls available.
            </p>
        </div>

    {% endfor %}

</div>
